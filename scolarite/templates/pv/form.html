{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="box box-default">
    <div class="box-header">
        <h3 class="card-title">
            {% trans "Ajouter un PV" %}
        </h3>
    </div>
    <div class="box-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> {% trans  "Enregistrer" %}</button>
            <a href="{% url 'pv_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
