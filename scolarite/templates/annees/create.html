{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="box">
    <div class="box box-header">
        <h3 class="card-title">
            {% if object.pk %}
                {% trans "Modifier une Année" %}
            {% else %}
                {% trans "Créer une Année" %}
            {% endif %}
        </h3>
    </div>
    <div class="box box-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">
                <i class="fa fa-save"></i> {% trans "Enregistrer" %}
            </button>
            <a href="{% url 'annee_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
