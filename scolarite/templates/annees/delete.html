{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="box ">
    <div class="box-header">
        <h3 class="card-title">{% trans "Confirmation" %}</h3>
    </div>
    <div class="box box-body">
        <p>Êtes-vous sûr de vouloir supprimer cette année : <strong>{{ object }}</strong> ?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">{% trans "Oui, supprimer" %}</button>
            <a href="{% url 'annee_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
