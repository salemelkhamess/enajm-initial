{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="box box-danger">
    <div class="box-header with-border">
        <h3 class="box-title">{% trans "Confirmer la suppression" %}</h3>
    </div>
    <div class="box-body">
        <p>Êtes-vous sûr de vouloir supprimer le rôle "{{ role.name }}" ?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">{% trans "Supprimer" %}</button>
            <a href="{% url 'role_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
