{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="box box-primary">
    <div class="box-header with-border"><h3 class="box-title">{% trans "Nouvelle évaluation" %}</h3></div>
    <div class="box-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-grid-3">
                <div class="form-group">
                    <label>{% trans "Matière" %} / {% trans "Secteur" %}</label>
                    <select name="couple" class="form-control" required>
                        {% for m, s in couples %}<option value="{{ m.id }}-{{ s.id }}">{{ m.nom }} — {{ s.nom }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>{% trans "Type" %}</label>
                    <select name="type" class="form-control" required>
                        {% for val, lib in types %}<option value="{{ val }}">{{ lib }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>{% trans "Trimestre" %}</label>
                    <select name="trimestre" class="form-control" required>
                        {% for t in trimestres %}<option value="{{ t.id }}" {% if t.id == trimestre_courant.id %}selected{% endif %}>{{ t.nom }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>{% trans "Date" %}</label>
                    <input type="date" name="date" value="{{ aujourdhui|date:'Y-m-d' }}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>{% trans "Coefficient" %}</label>
                    <input type="number" name="coefficient" value="1" min="0.5" step="0.5" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> {% trans "Créer" %}</button>
            <a href="{% url 'espace_prof_notes' %}" class="btn btn-link">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
