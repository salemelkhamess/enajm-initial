{% extends 'base.html' %}
{% load i18n %}
{% block content %}

<div class="box box-danger">
<h3 class="card-title">{% trans "Supprimer la matière" %}</h3>

    <div class="box-body">
        <p><strong>{{ object.nom }}</strong> ?</p>
        <form method="post">
            {% csrf_token %}
   <button type="submit" class="btn btn-danger">
    <i class="fa fa-trash"></i> {% trans "Supprimer" %}
</button>
<a href="{% url 'matiere_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
