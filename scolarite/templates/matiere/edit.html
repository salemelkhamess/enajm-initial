{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="box box-warning">
    <div class="box-header">
        <h3 class="card-title">{% trans "Modifier la matière" %}</h3>
    </div>
    <div class="box-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning">
                <i class="fa fa-edit"></i> {% trans "Mettre à jour" %}
            </button>
            <a href="{% url 'matiere_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
