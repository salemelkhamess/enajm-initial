{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="mt-4">
    <div class="box">
        <div class="box-header">
            <h3>{% blocktrans %}{{ title }}{% endblocktrans %}</h3>
        </div>
        <div class="box-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">{% trans "Enregistrer" %}</button>
{#                <a href="{% url '' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>#}
            </form>
        </div>
    </div>
</div>
{% endblock %}
