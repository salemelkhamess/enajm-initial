{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="box">
    <div class="box-header">
        <h3 class="box-title">{{ title }}</h3>
    </div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="box-body">
            {{ form.as_p }}
        </div>
        <div class="box-footer">
            <button type="submit" class="btn btn-primary">{% trans "Enregistrer" %}</button>
            <a href="{% url 'document_list' etudiant.id %}" class="btn btn-default">{% trans "Annuler" %}</a>
        </div>
    </form>
</div>
{% endblock %}
