{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="box box-danger">
    <div class="box-header">
        <h3 class="box-title">{% trans "Supprimer l'étudiant" %}</h3>
    </div>
    <div class="box-body">
        <p>Voulez-vous vraiment supprimer l'étudiant : <strong>{{ object.nom }} {{ object.prenom }}</strong> ?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="fa fa-trash"></i> Supprimer</button>
            <a href="{% url 'etudiant_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
