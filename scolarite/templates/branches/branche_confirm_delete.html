{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="box">
    <div class="box-header box-danger">
        <h3 class="box-title">{% trans "Confirmer la suppression" %}</h3>
    </div>

    <div class="box-body">


        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <button type="submit" class="btn btn-danger">
                    <i class="fa fa-trash"></i> {% trans "Confirmer la suppression" %}
                </button>
                <a href="{% url 'secteur_list' %}" class="btn btn-default">
                    <i class="fa fa-times"></i> {% trans "Annuler" %}
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
