{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="box">
    <div class="box-header box-info">
        <h3 class="box-title">
            {% if object %}{% trans "Modifier" %}{% else %}{% trans "Créer" %}{% endif %} {% trans "un classe" %}
        </h3>
    </div>

    <div class="box-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>{% trans "Nom du classe" %}</label>
                {{ form.nom }}
            </div>
            <div class="form-group">
                <label>{% trans "Departement associée" %}</label>
                {{ form.formation }}
            </div>
            <button type="submit" class="btn btn-success">
                <i class="fa fa-save"></i> {% trans "Enregistrer" %}
            </button>
            <a href="{% url 'secteur_list' %}" class="btn btn-default">
                {% trans "Annuler" %}
            </a>
        </form>
    </div>
</div>
{% endblock %}
