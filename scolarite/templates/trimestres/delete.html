{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="box box-danger">
    <div class="box-header">
        <h3>{% trans "Supprimer le trimestre" %}</h3>
    </div>
    <div class="box-body">
        <p>Confirmez-vous la suppression du trimestre n° {{ object.numero_trimestre }} de l'année {{ object.annee.numero_annee }} ?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">{% trans "Supprimer" %}</button>
            <a href="{% url 'trimestre_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
