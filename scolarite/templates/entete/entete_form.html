{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="box">
    <div class="box-header">
        <h3>
            {% if form.instance.pk %}
                {% trans "Modifier une entête" %}
            {% else %}
                {% trans "Ajouter une entête" %}
            {% endif %}
        </h3>
    </div>
    <div class="box-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">{% trans "Enregistrer" %}</button>
            <a href="{% url 'entete_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
