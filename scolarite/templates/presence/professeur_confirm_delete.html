{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="box">
    <div class="box-header">
        <h3>{% trans "Supprimer la présence" %}</h3>
    </div>
    <div class="box-body">
        <p>Voulez-vous vraiment supprimer cette présence pour <strong>{{ object.professeur.nom }} {{ object.professeur.prenom }}</strong> ?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">{% trans "Confirmer" %}</button>
            <a href="{% url 'presence_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
