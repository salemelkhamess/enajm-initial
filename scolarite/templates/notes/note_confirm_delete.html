{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="box">
    <div class="box-header">
        <h3>{% trans "Supprimer la note" %}</h3>
    </div>
    <div class="box-body">
        <p>{% trans "Voulez-vous vraiment supprimer cette note ?" %}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">{% trans "Confirmer" %}</button>
            <a href="{% url 'note_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
