{% extends 'base.html' %}
{% load i18n %}  {# Charger les tags de traduction #}


{% block content %}
<div class="box">
    <div class="box-header">
        <h3 class="box-title">{% trans "Créer un departement" %}</h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">{% trans "Enregistrer" %}</button>
            <a href="{% url 'formation_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
        </form>
    </div>
</div>
{% endblock %}
