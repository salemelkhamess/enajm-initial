{% extends 'base.html' %}
{% load i18n %}
{% block content %}

<div class="box mt-3">
<div class="box-header">
          <h3>{% trans "Ajouter / Modifier Utilisateur" %}</h3>

</div>
<div class="box-body">
  <form method="POST">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        {{ field.label_tag }}
        {{ field }}
        {% if field.errors %}
          <div class="text-danger">{{ field.errors }}</div>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-success">{% trans "Créer" %}</button>
    <a href="{% url 'user_list' %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
  </form>
</div>
</div>
{% endblock %}
